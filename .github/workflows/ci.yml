# CI: the test suite on every push and pull request, across supported
# Python versions. The contamination gate's generic self-check runs
# inside the suite (tests/gate/test_self.py scans this whole tree for
# address literals, home paths, secret shapes, and opaque binaries),
# so "the gate runs on every commit" is enforced here, not just
# asserted. Name-denylisting is the operator's local additions, read
# from outside the tree by design, and is not part of public CI.
#
# Each Python version runs the suite in three shards side by side
# (.github/scripts/suite.py: whole test modules, cut by the module times
# in .github/test-timings.json). The `test (3.x)` job of each version is
# the one branch protection requires: it passes only when all three of
# its shards passed and, together, ran every discovered module exactly
# once. It runs whatever happened to the shards (`if: always()`): a
# required check that is skipped counts as passed, so it must fail
# instead.
name: ci

on:
  push:
  pull_request:

jobs:
  shard:
    name: test (${{ matrix.python-version }}) shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        shard: [1, 2, 3]
    steps:
      # The whole history and its tags: the docs test compares each
      # released CHANGELOG section with the one its own tag shipped.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no third-party dependencies)
        run: pip install -e .
      - name: Every test module is in exactly one shard
        run: python .github/scripts/suite.py check --of 3
      - name: Run the shard (the gate self-check is in one of them)
        # With the tags fetched, the CHANGELOG check fails rather than skips.
        env:
          COUSIN_REQUIRE_TAGS: "1"
        run: >-
          python .github/scripts/suite.py run --shard ${{ matrix.shard }} --of 3
          --result shard-${{ matrix.shard }}.json
      - name: Keep what the shard ran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.python-version }}-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7

  # The same suite with the optional dependencies installed: without the
  # Agent SDK and the MCP SDK every sdk-lane and MCP-serving test skips
  # itself whole, so the lane the fleet runs on gated no merge. One
  # Python, three shards, checked like the others by `test (sdk lane)`.
  shard-sdk:
    name: test (sdk lane) shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install with the sdk and mcp extras
        run: pip install -e ".[sdk,mcp]"
      - name: Run the shard
        env:
          COUSIN_REQUIRE_TAGS: "1"
        run: >-
          python .github/scripts/suite.py run --shard ${{ matrix.shard }} --of 3
          --result shard-${{ matrix.shard }}.json
      - name: Keep what the shard ran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-sdk-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7

  test-sdk:
    name: test (sdk lane)
    needs: shard-sdk
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-sdk-*
          path: shards
          merge-multiple: true
      - name: All three shards passed and ran every module once
        run: python3 .github/scripts/suite.py verify --of 3 shards

  # The same suite with every temporary file on tmpfs (#286): a race that
  # needs a fast disk to show (#29: 11 of 20 runs failed on tmpfs, none on
  # ext4) is caught by design, not by luck. The sdk and mcp extras are in,
  # so the lanes the fleet runs are covered too.
  shard-tmpfs:
    name: test (tmpfs) shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install with the sdk and mcp extras
        run: pip install -e ".[sdk,mcp]"
      - name: Run the shard with TMPDIR on /dev/shm
        env:
          COUSIN_REQUIRE_TAGS: "1"
        run: >-
          mkdir -p /dev/shm/cf-tmp && TMPDIR=/dev/shm/cf-tmp
          python .github/scripts/suite.py run --shard ${{ matrix.shard }} --of 3
          --result shard-${{ matrix.shard }}.json
      - name: Keep what the shard ran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-tmpfs-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7

  test-tmpfs:
    name: test (tmpfs)
    needs: shard-tmpfs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-tmpfs-*
          path: shards
          merge-multiple: true
      - name: All three shards passed and ran every module once
        run: python3 .github/scripts/suite.py verify --of 3 shards

  test:
    name: test (${{ matrix.python-version }})
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-${{ matrix.python-version }}-*
          path: shards
          merge-multiple: true
      - name: All three shards passed and ran every module once
        run: python3 .github/scripts/suite.py verify --of 3 shards
