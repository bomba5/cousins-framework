# The README's Docker quick start, run as written. The README is the only
# copy: .github/scripts/quickstart.py extracts its one fenced block, drops
# the `git clone` and `cd` lines (this job is already in the checkout) and
# runs it under a pty that types the console password at adduser's prompts.
#
#   tier 1, every push and pull request: one substitution, the spawn
#     line's opencode lane becomes `--runner fake` (no model, no network
#     model); check 3 is the fake runner's turn on the message.
#   tier 2, every v* tag: the block literally, on opencode's free model;
#     check 3 is a real reply from the cousin.
#
# After the block, both tiers: 1 the framework turns healthy, 2 the console
# login as ana, 3 hi to wren, 4 a memory survives `docker compose restart`,
# 5 and `docker compose down` + `up -d`. The embeddings service is never
# waited on: until it is up, search is keyword only, as the README says.
#
# Pipefail: every job sets `shell: bash` (GitHub's default `bash -e {0}`
# has no pipefail; an explicit `shell: bash` runs `bash -eo pipefail {0}`)
# and every step starts with `set -euo pipefail`, so dropping one still
# leaves the other. No step pipes into tail, tee, head or grep and none
# ends in `|| true`.
name: quickstart

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  quickstart:
    name: quick start, tier ${{ matrix.tier }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Tier 2 only on a v* tag.
        tier: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '[1, 2]' || '[1]') }}
    defaults:
      run:
        shell: bash
    env:
      QS: .github/scripts/quickstart.py
      COMPOSE_PROGRESS: plain
      COMPOSE_ANSI: never
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Extract the README quick start
        run: |
          set -euo pipefail
          python "$QS" extract --tier "${{ matrix.tier }}" --out "$RUNNER_TEMP/quickstart.sh"
      - name: A throwaway console password
        run: |
          set -euo pipefail
          password="ci-$(python -c 'import secrets; print(secrets.token_hex(16))')"
          echo "::add-mask::$password"
          echo "QUICKSTART_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Run the quick start (compose build, adduser, accounts, spawn)
        run: |
          set -euo pipefail
          python "$QS" run "$RUNNER_TEMP/quickstart.sh"
      - name: Check 1, the framework container is healthy
        run: |
          set -euo pipefail
          python "$QS" healthy
      - name: Check 2, log in to the console as ana
        run: |
          set -euo pipefail
          python "$QS" login
      - name: Check 3, hi to wren (tier 1 a fake turn, tier 2 a real reply)
        run: |
          set -euo pipefail
          python "$QS" converse --tier "${{ matrix.tier }}"
      - name: Check 4, a memory survives docker compose restart
        run: |
          set -euo pipefail
          python "$QS" remember --state "$RUNNER_TEMP/memory.json"
          docker compose restart framework
          python "$QS" healthy --check 4
          python "$QS" recall --state "$RUNNER_TEMP/memory.json" --check 4
      - name: Check 5, a memory survives docker compose down and up
        run: |
          set -euo pipefail
          docker compose down
          docker compose up -d
          python "$QS" healthy --check 5
          python "$QS" recall --state "$RUNNER_TEMP/memory.json" --check 5
      - name: On failure, the containers and the framework's log
        if: failure()
        run: |
          set -euo pipefail
          docker compose ps -a
          docker compose logs --no-color --timestamps framework
