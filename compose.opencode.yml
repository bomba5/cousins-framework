# This override is no longer needed: the default image (compose.yml with
# no override) carries the pinned opencode binary. It is kept so a setup
# that passes it still works: the one framework service builds the
# image's `opencode` target, the old name of that same default image (no
# node, no bun), tagged cousins-framework:opencode. Everything else (the
# volume, the port, the environment) is compose.yml's. To stop using it,
# drop it from your -f files (or delete compose.override.yml if it is a
# copy of this file) and run `docker compose up -d --build`.
services:
  framework:
    build:
      context: .
      target: opencode
    image: cousins-framework:opencode
