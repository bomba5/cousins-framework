# The framework in one container: the supervisor starts the console, the
# loops daemon and one runner per runner cousin. All state is on the
# framework-data volume, so `docker compose down && docker compose up`
# keeps every cousin, message and session.
#
#   docker compose up -d --build        then open http://127.0.0.1:8600
#   docker compose logs -f framework    every child's lines, prefixed
#
# Auth, one of three lanes:
#   - opencode, no Claude account: an opencode account in
#     config/accounts.toml (the default image carries the opencode binary).
#     Its free models need no key (providers = ["opencode"]); it also takes
#     a provider key you hold, or a local endpoint. Worked example:
#     docs/install.md.
#   - API key: put the key in secrets/anthropic_api_key (chmod 700 secrets,
#     chmod 644 the file: the container's user, uid 10001, must read it),
#     then: cp compose.api-key.yml compose.override.yml
#   - Login: docker compose exec framework cousin-account login <name>
#     (a claude-login account in config/accounts.toml; its credentials stay
#     on the volume).
# The terms risk of using a subscription login from a container is yours.
# Started with -f files? Give the same -f files to every later command: a
# plain `docker compose up -d` reads this file and compose.override.yml only.
name: cousins-framework

services:
  framework:
    build: .
    image: cousins-framework:local
    restart: unless-stopped
    # The supervisor gives the runners runner.main.STOP_TIMEOUT_S + 5 = 35 s
    # to finish a turn after SIGTERM, then the loops daemon and the console
    # 10 s each, but neither of those handles SIGTERM (both exit at once), so
    # the real worst case is 35 s and 45 s covers it; compose's default of
    # 10 s would kill a runner mid-turn.
    stop_grace_period: 45s
    ports:
      # Loopback only: with no config/console-users.json the console is
      # open. For the LAN, add a user first, then publish "8600:8600".
      - "127.0.0.1:8600:8600"
    volumes:
      - framework-data:/data
      # The login lane from a host credential directory instead of
      # `cousin-account login`: mount it read-write as the account's
      # config_dir (default data/accounts/<name> under the root). Its files
      # must be readable and writable by uid 10001.
      # - /path/to/credentials:/data/data/accounts/host-login
    environment:
      # A cousin created in the container runs on the SDK runner.
      COUSIN_DEFAULT_RUNNER: sdk
      # Semantic memory search: on a start with no config/embedding.toml,
      # the entrypoint writes one pointing at the embeddings service below
      # (an existing file is never touched). The model is the one that
      # service pulls, tag and all. No depends_on: while the service is
      # down or still pulling, search is keyword only, with a notice.
      COUSIN_EMBEDDING_URL: http://embeddings:11434/api/embeddings
      COUSIN_EMBEDDING_MODEL: nomic-embed-text:v1.5

  # Semantic memory search, on by default: Ollama, reached by the framework
  # on the compose network only (no published port). The image is a 3.8 GB
  # download; its first start pulls the model (274 MB, pinned by tag: Ollama
  # pulls by name:tag) onto the embeddings-models volume, and a later start
  # finds it there and pulls nothing. With no network the pull is retried every
  # minute while the server runs, and the cousins run meanwhile on keyword
  # search. Healthy once the model is on the volume:
  #   docker compose ps embeddings
  # Your own Ollama instead, or none (keyword search only), with nothing
  # pulled: compose.own-ollama.yml, see docs/install.md "Your own Ollama,
  # or none".
  embeddings:
    image: ollama/ollama:0.34.4
    restart: unless-stopped
    volumes:
      - embeddings-models:/root/.ollama
    environment:
      EMBEDDING_MODEL: nomic-embed-text:v1.5
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve & serve=$$!
        trap 'kill -TERM $$serve; wait $$serve; exit 0' TERM INT
        (
          until ollama list >/dev/null 2>&1; do sleep 1; done
          ollama show "$$EMBEDDING_MODEL" >/dev/null 2>&1 && exit 0
          echo "embeddings: pulling $$EMBEDDING_MODEL" >&2
          until ollama pull "$$EMBEDDING_MODEL" >/tmp/pull.log 2>&1; do
            tail -c 300 /tmp/pull.log >&2
            echo "embeddings: pulling $$EMBEDDING_MODEL failed; again in 60 s" >&2
            sleep 60
          done
          echo "embeddings: $$EMBEDDING_MODEL is ready" >&2
        ) &
        wait $$serve
    healthcheck:
      test: ["CMD-SHELL", 'ollama show "$$EMBEDDING_MODEL" >/dev/null']
      interval: 60s
      timeout: 10s
      start_period: 15m
      start_interval: 5s

  # The image is the Dockerfile's default target, which carries the pinned
  # opencode binary (no node, no bun). For a Claude-only install that wants
  # the smaller image without it, the slim override (not a profile: it
  # changes the framework service's image, the `slim` target):
  #   cp compose.slim.yml compose.override.yml
  #   docker compose up -d --build

volumes:
  framework-data:
  embeddings-models:
