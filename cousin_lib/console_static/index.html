<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>cousins</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="cousins" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<!--
  Libraries, kept under vendor/ at pinned versions (cousin_lib/console/
  build.py, LIBS): react 18.3.1, react-dom 18.3.1 (production UMD),
  marked 15.0.12, and on first use xterm 5.3.0 and xterm-addon-fit
  0.8.0. mermaid 10.9.8 comes from jsdelivr on the first diagram,
  pinned with its SRI hash (build.py, CDN_LIBS); Babel comes from unpkg
  only while the compiled copy is stale (below).
-->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/marked.min.js"></script>
<!-- Libraries most opens never use: mermaid on the first diagram, xterm
     when the live pane opens. Inert here; window.loadLib(name) copies a
     library's tags into <head> and resolves with the library. -->
<template id="lazy-libs">
<script data-lib="mermaid" src="https://cdn.jsdelivr.net/npm/mermaid@10.9.8/dist/mermaid.min.js" integrity="sha384-N3QqR/7q+xm3BGX+CBbNI8AUmRRqcsDzToy+0z1NLDI0QmTKW8zvwLvqulJgk3dP" crossorigin="anonymous"></script>
<link data-lib="xterm" rel="stylesheet" href="vendor/xterm.min.css" />
<script data-lib="xterm" src="vendor/xterm.min.js"></script>
<script data-lib="xterm" src="vendor/xterm-addon-fit.min.js"></script>
</template>
<script>
  (function () {
    var READY = {
      mermaid: function () {
        window.mermaid.initialize({ startOnLoad: false, theme: "dark", securityLevel: "loose" });
        return window.mermaid;
      },
      xterm: function () { return window.Terminal; },
    };
    var loading = {};
    function copy(tag) {
      return new Promise(function (resolve, reject) {
        var el = document.createElement(tag.tagName.toLowerCase());
        if (el.tagName === "LINK") { el.rel = "stylesheet"; el.href = tag.getAttribute("href"); }
        else { el.src = tag.getAttribute("src"); el.async = false; }  // in order: the fit addon after xterm
        if (tag.getAttribute("integrity")) {
          el.integrity = tag.getAttribute("integrity");
          el.crossOrigin = "anonymous";
        }
        el.onload = function () { resolve(); };
        el.onerror = function () { reject(new Error("could not load " + (el.src || el.href))); };
        document.head.appendChild(el);
      });
    }
    window.loadLib = function (name) {
      var tags = document.getElementById("lazy-libs").content.querySelectorAll('[data-lib="' + name + '"]');
      if (!READY[name] || !tags.length) return Promise.reject(new Error("no library " + name));
      if (!loading[name]) {
        loading[name] = Promise.all(Array.prototype.map.call(tags, copy)).then(READY[name]);
        // a failed load is retried on the next call
        loading[name].catch(function () { delete loading[name]; });
      }
      return loading[name];
    };
  })();
</script>

<!-- app:start
  The app, one file per area. static.py serves compiled/<name>.js in
  place of each .jsx while compiled/manifest.json matches the sources
  (cousin_lib/console/build.py), and drops the Babel tag; otherwise the
  browser compiles the .jsx itself, so an edit shows on the next reload. -->
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- Load order matters: each file publishes its exports on window for the next. -->
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="media.jsx"></script>
<script type="text/babel" src="chat.jsx"></script>
<script type="text/babel" src="explorer.jsx"></script>
<script type="text/babel" src="cousins.jsx"></script>
<script type="text/babel" src="views.jsx"></script>
<script type="text/babel" src="meetings.jsx"></script>
<!-- The package block: one file per UI parity package, each registering
     its slots and views through ui.jsx (registerSlot, registerView). A
     package edits only its own file; app.jsx renders after them all. -->
<script type="text/babel" src="agent.jsx"></script>
<script type="text/babel" src="migrate.jsx"></script>
<script type="text/babel" src="accounts.jsx"></script>
<script type="text/babel" src="mcp.jsx"></script>
<script type="text/babel" src="system.jsx"></script>
<script type="text/babel" src="plugins.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<!-- app:end -->
</body>
</html>
