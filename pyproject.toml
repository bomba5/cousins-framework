[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cousins-framework"
version = "2.5.0"
description = "Persistent, co-located AI agents: identity, memory, lifecycle, inter-agent chat"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Jhonata Poma-Hansen" }]

[project.scripts]
cousin-gate = "cousin_lib.gate.cli:main"
cousin-reply = "cousin_lib.reply:reply_main"
cousin-chat = "cousin_lib.chat:chat_main"
cousin-chat-import = "cousin_lib.chat_import:main"
cousin-spawn = "cousin_lib.spawn:spawn_main"
cousin-schedule = "cousin_lib.schedule:schedule_main"
cousin-job = "cousin_lib.jobs:jobs_main"
cousin-tracker = "cousin_lib.tracker:tracker_main"
cousin-meeting = "cousin_lib.meetings:meeting_main"
cousin-memory = "cousin_lib.memory:memory_main"
cousin-flip = "cousin_lib.flip:flip_main"
cousin-account = "cousin_lib.accounts:account_main"
cousin-version = "cousin_lib.version:version_main"
cousin-reincarnate = "cousin_lib.lifecycle:reincarnate_main"
cousin-transplant = "cousin_lib.lifecycle:transplant_main"
cousin-self-portrait = "cousin_lib.self_portrait:portrait_main"
cousin-shared = "cousin_lib.shared_tier:shared_main"
cousin-loops = "cousin_lib.loops:loops_main"
cousin-cycle = "cousin_lib.cycle:cycle_main"
cousin-session = "cousin_lib.session:session_main"
cousin-callback = "cousin_lib.callback:callback_main"
cousin-reason = "cousin_lib.capsule:reason_main"
cousin-backup = "cousin_lib.backup:backup_main"
cousin-sync-state = "cousin_lib.sync_state:sync_state_main"
cousin-ui = "cousin_lib.ui:ui_main"
cousin-console = "cousin_lib.console.app:console_main"
cousin-image = "cousin_lib.media:image_main"
cousin-voice = "cousin_lib.media:voice_main"
cousin-video = "cousin_lib.media:video_main"
cousin-telegram = "cousin_lib.telegram:telegram_main"
cousin-hive = "cousin_lib.hive:hive_main"
cousin-spawn-node = "cousin_lib.spawn_node:spawn_node_main"
cousin-cache-audit = "cousin_lib.cache_audit:cache_audit_main"
cousin-sweep = "cousin_lib.sweep:sweep_main"
cousin-tool-surface = "cousin_lib.tool_surface:tool_surface_main"
cousin-mcp = "cousin_lib.mcp_server:mcp_main"
cousin-runner = "cousin_lib.runner.main:runner_main"
cousin-watch = "cousin_lib.watch:watch_main"
cousin-supervisor = "cousin_lib.supervisor:supervisor_main"
cousin-migrate = "cousin_lib.migrate:migrate_main"

[project.optional-dependencies]
# Serving MCP needs the reference SDK; everything else in the adapter
# (registry, schemas, argv assembly, provisioning, approval) is stdlib.
mcp = ["mcp>=1.2,<2"]
# The runner's SDK lane. Imported lazily in cousin_lib/runner/sdk.py only.
sdk = ["claude-agent-sdk>=0.2.159,<0.3"]

[tool.setuptools.packages.find]
include = ["cousin_lib*"]

[tool.setuptools.package-data]
# The web console is served from beside the module; without this a
# wheel ships the code but not the pages it serves.
cousin_lib = ["ui_static/*", "console_static/*"]
